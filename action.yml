name: "packdev compat check"
description: >-
  Runs packdev compat against a bumped dependency on a Dependabot/Renovate
  PR and reports a verdict as a PR comment and check run.
author: "dionmaicon"

inputs:
  test-command:
    description: >-
      Command to run inside the sandboxed install to verify compatibility.
      Exactly one of test-command/test-script is required. Prefer
      test-script whenever this would just be a package-manager
      invocation of one named script (e.g. "npm test") — packdev's own
      harness-caveat detection (a version that only type-checks or only
      transpiles without type-checking) pattern-matches the LITERAL
      command string, so it can never see through an "npm test"
      indirection to the app's real script body. test-command remains
      right for a genuinely custom multi-step command.
    required: false
  test-script:
    description: >-
      Name of the package.json script to run (e.g. "test") — packdev
      resolves it from each target's own package.json, both to run it and
      to analyze its real body for harness caveats. Exactly one of
      test-command/test-script is required.
    required: false
  github-token:
    description: "Token used to post the check run and PR comment. Needs pull-requests: write and checks: write."
    required: true
    default: ${{ github.token }}
  auto-merge:
    description: "Merge the PR automatically when the verdict is PASSED. Off by default."
    required: false
    default: "false"
  allowed-actors:
    description: "Comma-separated list of PR authors this action acts on."
    required: false
    default: "dependabot[bot],renovate[bot]"
  fail-step-on-non-pass:
    description: "Fail this Action step (in addition to the check run conclusion) when the verdict isn't PASSED or PASSED_WEAK."
    required: false
    default: "true"
  test-combined-bump:
    description: >-
      Only relevant when a PR bumps multiple packages in one file to
      DIFFERING target versions (not Dependabot's own grouped updates,
      which always share one version — but possible from a custom
      actor/agent-authored PR). Each bump is always tested in isolation;
      this controls whether an EXTRA run also tests the PR's real combined
      state (every bump applied at once) to catch an interaction bug
      isolation alone can't see. Defaults to true (N+1 sandbox runs). Set
      to "false" to cap cost at N isolated runs only.
    required: false
    default: "true"
  package-json-path:
    description: >-
      Optional override, relative to the repo root. Without it (the
      default), the action auto-discovers which package.json actually
      changed between the PR's base and head — the right behavior for a
      monorepo with more than one independently-Dependabot-tracked
      workspace member, since each gets its own PR touching a different
      file. Set this only to explicitly pin scanning to one file, e.g.
      "packages/api/package.json".
    required: false
  brain:
    description: >-
      Model backend for failure-summary prose only — never decides
      pass/fail. One of: none, anthropic, openai-compatible.
    required: false
    default: "none"
  anthropic-api-key:
    description: "Required when brain: anthropic."
    required: false
  anthropic-model:
    description: "Defaults to claude-sonnet-5."
    required: false
  openai-compatible-base-url:
    description: "Required when brain: openai-compatible. E.g. https://api.openai.com/v1, or a local Ollama/vLLM endpoint."
    required: false
  openai-compatible-api-key:
    description: "Optional — local endpoints usually don't need one."
    required: false
  openai-compatible-model:
    description: "Required when brain: openai-compatible."
    required: false

outputs:
  status:
    description: "skipped-actor | unsupported-bump | verdict"
  verdict:
    description: "The Verdict kind (only set when status is verdict): NO_CONTROL, HARNESS_BROKEN, INSTALL_FAILED, NOTHING_TESTED, INCOMPATIBLE, PASSED_WEAK, PASSED."
  merged:
    description: "\"true\" if auto-merge fired (only set when status is verdict)."

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        # Full history is required: prepareWorkspace checks out and installs
        # the PR's BASE ref (not the head) so packdev's control resolution
        # gets the pre-bump version — see docs/architecture.md "The control
        # problem". A shallow checkout can leave the base commit unreachable.
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install packdev-agents
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Build packdev-agents
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run packdev compat check
      shell: bash
      run: node ${{ github.action_path }}/dist/adapters/github-action/main.js
      env:
        INPUT_TEST-COMMAND: ${{ inputs.test-command }}
        INPUT_TEST-SCRIPT: ${{ inputs.test-script }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_AUTO-MERGE: ${{ inputs.auto-merge }}
        INPUT_ALLOWED-ACTORS: ${{ inputs.allowed-actors }}
        INPUT_FAIL-STEP-ON-NON-PASS: ${{ inputs.fail-step-on-non-pass }}
        INPUT_PACKAGE-JSON-PATH: ${{ inputs.package-json-path }}
        INPUT_TEST-COMBINED-BUMP: ${{ inputs.test-combined-bump }}
        INPUT_BRAIN: ${{ inputs.brain }}
        INPUT_ANTHROPIC-API-KEY: ${{ inputs.anthropic-api-key }}
        INPUT_ANTHROPIC-MODEL: ${{ inputs.anthropic-model }}
        INPUT_OPENAI-COMPATIBLE-BASE-URL: ${{ inputs.openai-compatible-base-url }}
        INPUT_OPENAI-COMPATIBLE-API-KEY: ${{ inputs.openai-compatible-api-key }}
        INPUT_OPENAI-COMPATIBLE-MODEL: ${{ inputs.openai-compatible-model }}
