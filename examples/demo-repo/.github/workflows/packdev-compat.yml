name: packdev compat check

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  compat:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dionmaicon/packdev-agents@main
        with:
          test-command: "npm test"
