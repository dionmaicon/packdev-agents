name: "packdev agentic triage (experimental)"
description: >-
  Runs an experimental, model-driven triage of a Dependabot/Renovate bump:
  a coding agent decides for itself which of packdev's own tools
  (api-diff, compat, dupes, behavior-diff) to run and in what order, then
  posts its findings as an advisory PR comment. Never gates a merge — this
  is meant to run ALONGSIDE the main "packdev compat check" action
  (../action.yml), not replace it.

  IMPORTANT — set `timeout-minutes` on the calling JOB (a composite action
  cannot set this on itself): each model API request already has its own
  request-timeout-ms fail-fast guard (default 90s per request, not per
  whole run — see agentLoop.ts), but that only protects against a single
  stuck HTTP call. A job-level timeout-minutes is the actual cost backstop
  — without one, a provider that keeps responding just slowly enough to
  dodge each per-request timeout (or a runaway multi-turn loop) keeps
  billing CI minutes indefinitely. Example:
    jobs:
      agentic-triage:
        timeout-minutes: 5
        steps:
          - uses: dionmaicon/packdev-agents/agentic-triage-action@main
            ...
author: "dionmaicon"

inputs:
  model-provider:
    description: >-
      Which backend drives the tool-use loop. One of: anthropic,
      openai-compatible (covers hosted OpenAI, Z.ai's GLM Coding Plan
      endpoint, and any local OpenAI-compatible endpoint like Ollama/vLLM).
    required: false
    default: "anthropic"
  anthropic-api-key:
    description: "Required when model-provider: anthropic."
    required: false
  anthropic-model:
    description: "Defaults to claude-sonnet-5."
    required: false
  openai-compatible-base-url:
    description: >-
      Required when model-provider: openai-compatible. E.g.
      https://api.z.ai/api/coding/paas/v4 (Z.ai Coding Plan — NOT
      /api/paas/v4, that's the pay-as-you-go endpoint), https://api.openai.com/v1,
      or a local Ollama/vLLM endpoint.
    required: false
  openai-compatible-api-key:
    description: "Required for most hosted endpoints (Z.ai, OpenAI); optional for local endpoints."
    required: false
  openai-compatible-model:
    description: "Required when model-provider: openai-compatible, e.g. glm-5.3-flash."
    required: false
  github-token:
    description: "Token used to post the advisory comment and check run. Needs pull-requests: write and checks: write."
    required: true
    default: ${{ github.token }}
  allowed-actors:
    description: "Comma-separated list of PR authors this action acts on."
    required: false
    default: "dependabot[bot],renovate[bot]"
  package-json-path:
    description: >-
      Optional override, relative to the repo root. Without it (the
      default), auto-discovers which package.json actually changed —
      same behavior as the main action's equivalent input.
    required: false
  max-turns:
    description: "Hard cap on model/tool round-trips before this fails as a runaway loop. Defaults to 10."
    required: false
  request-timeout-ms:
    description: >-
      Hard cap per individual model API request (not per turn, not per
      whole run) — fails fast when a provider stops responding entirely,
      instead of hanging. Defaults to 90000 (90s). This is NOT a
      replacement for setting timeout-minutes on the calling job (see the
      top of this file) — that is the real CI-cost backstop.
    required: false
  max-output-tokens:
    description: >-
      Per-request max_tokens sent to the model. Defaults to 8000. Some
      models (e.g. Z.ai's GLM Coding Plan models) spend a large, invisible
      token budget on chain-of-thought reasoning before the visible
      response even starts — too low a value cuts the response off with
      finish_reason "length" and NO visible content at all, which surfaces
      as a hard error, not a truncated report. Raise this if you see that.
    required: false

outputs:
  status:
    description: "skipped-actor | unsupported-bump | triaged"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        # Same reason as the main action: prepareWorkspace checks out and
        # installs the PR's BASE ref, which needs full history reachable.
        fetch-depth: 0
        # Explicit on purpose: GitHub Actions workflows triggered by
        # Dependabot's `pull_request` event run read-only and WITHOUT
        # repository secrets — a hard platform restriction (Dependabot PRs
        # are treated like fork PRs for secret access). The documented
        # workaround is `pull_request_target` on the calling workflow,
        # which defaults `github.ref`/checkout to the BASE branch, not the
        # PR — so the head SHA must be requested explicitly here, or this
        # action would silently analyze the wrong commit. Safe for
        # `pull_request` too (github.event.pull_request.head.sha exists on
        # both events), so this line doesn't have to vary by trigger type.
        ref: ${{ github.event.pull_request.head.sha }}

    - uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install packdev-agents
      shell: bash
      # This action.yml lives one directory below the repo root (see the
      # module doc comment above for why this is a separate action rather
      # than a mode flag on the main one) — action_path points HERE, but
      # package.json/dist/ live at the repo root, one level up.
      working-directory: ${{ github.action_path }}/..
      run: npm ci

    - name: Build packdev-agents
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm run build

    - name: Run agentic triage
      shell: bash
      run: node ${{ github.action_path }}/../dist/adapters/agentic-triage/main.js
      env:
        INPUT_MODEL-PROVIDER: ${{ inputs.model-provider }}
        INPUT_ANTHROPIC-API-KEY: ${{ inputs.anthropic-api-key }}
        INPUT_ANTHROPIC-MODEL: ${{ inputs.anthropic-model }}
        INPUT_OPENAI-COMPATIBLE-BASE-URL: ${{ inputs.openai-compatible-base-url }}
        INPUT_OPENAI-COMPATIBLE-API-KEY: ${{ inputs.openai-compatible-api-key }}
        INPUT_OPENAI-COMPATIBLE-MODEL: ${{ inputs.openai-compatible-model }}
        INPUT_GITHUB-TOKEN: ${{ inputs.github-token }}
        INPUT_ALLOWED-ACTORS: ${{ inputs.allowed-actors }}
        INPUT_PACKAGE-JSON-PATH: ${{ inputs.package-json-path }}
        INPUT_MAX-TURNS: ${{ inputs.max-turns }}
        INPUT_REQUEST-TIMEOUT-MS: ${{ inputs.request-timeout-ms }}
        INPUT_MAX-OUTPUT-TOKENS: ${{ inputs.max-output-tokens }}
