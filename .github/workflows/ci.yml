name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # prepareWorkspace supports pnpm-lock.yaml repos and the test suite
      # exercises a real pnpm install — pnpm isn't preinstalled on the
      # runner image, corepack ships with Node and can activate it.
      - run: corepack enable && corepack prepare pnpm@latest --activate

      - run: npm ci

      - run: npm test
